<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlykemiaTracker - Konfigurácia Cloudu</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { color: #81D4FA; margin-bottom: 10px; }
        p { color: #bbbbbb; font-size: 0.9em; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #81D4FA; font-weight: bold; font-size: 0.8em; }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }
        input:focus { border-color: #81D4FA; outline: none; }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background-color: #00B0FF;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #0081cb; }
        #qrcode {
            margin-top: 30px;
            padding: 15px;
            background-color: white;
            border-radius: 10px;
            display: none;
            justify-content: center;
        }
        .footer {
            margin-top: 40px;
            color: #555;
            font-size: 0.7em;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🩸 GlykemiaTracker</h1>
        <p>Zadajte údaje z vašej Firebase konzoly a vygenerujte QR kód pre nastavenie aplikácie.</p>

        <div class="input-group">
            <label for="pid">Project ID</label>
            <input type="text" id="pid" placeholder="napr. glykemia-tracker">
        </div>

        <div class="input-group">
            <label for="key">Project number</label>
            <input type="text" id="key" placeholder="Zadajte číslo projektu z konzoly">
        </div>

        <div class="input-group">
            <label for="aid">App ID</label>
            <input type="text" id="aid" placeholder="1:1234567890:android:abc123">
        </div>

        <button onclick="generateQR()">VYGENEROVAŤ QR KÓD</button>

        <div id="qrcode"></div>
        <button id="printBtn" style="display: none; background-color: #4CAF50; margin-top: 10px;" onclick="window.print()">VYTLAČIŤ KARTU</button>
    </div>

    <div class="footer">
        Vyvinuté v prostredí Android Studio Panda v úzkej spolupráci s umelou inteligenciou Gemini.<br>
        GlykemiaTracker v18.2 | 2026
    </div>

    <style>
        @media print {
            body * { visibility: hidden; }
            #qrcode, #qrcode * { visibility: visible; }
            #qrcode {
                position: absolute;
                left: 0; top: 0;
                width: 100%;
                text-align: center;
                background-color: white !important;
                padding: 50px;
            }
        }
    </style>

    <script>
        function generateQR() {
            const pid = document.getElementById('pid').value.trim();
            const key = document.getElementById('key').value.trim();
            const aid = document.getElementById('aid').value.trim();

            if (!pid || !key || !aid) {
                alert("Prosím vyplňte všetky tri polia.");
                return;
            }

            const config = { pid, key, aid };

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            qrContainer.style.display = 'flex';

            try {
                new QRCode(qrContainer, {
                    text: JSON.stringify(config),
                    width: 250,
                    height: 250,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.M
                });
                document.getElementById('printBtn').style.display = 'block';
                setTimeout(() => qrContainer.scrollIntoView({ behavior: 'smooth' }), 100);
            } catch (e) {
                alert("Chyba pri generovaní QR kódu.");
            }
        }
    </script>
</body>
</html>
